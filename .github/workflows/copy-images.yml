name: Copy Images
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only show what would be copied (no push)'
        type: boolean
        default: true

permissions:
  contents: read
  packages: read

jobs:
  copy:
    name: Copy controller1/invoker1 into controller/invoker
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: GHCR login
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Registry login
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USER" --password-stdin

      - name: Copy images
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          OPSROOT=.github/workflows/opsroot.json

          # controller1 -> controller, invoker1 -> invoker
          PAIRS="controller invoker"

          echo "## Copy report (dry_run=$DRY_RUN)" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"

          FAILED=0
          for NAME in $PAIRS; do
            SRC=$(jq -r --arg k "${NAME}1" '.config.images[$k] // empty' "$OPSROOT")
            DST=$(jq -r --arg k "$NAME"    '.config.images[$k] // empty' "$OPSROOT")

            if [ -z "$SRC" ] || [ -z "$DST" ]; then
              echo "missing ${NAME}1 or $NAME in $OPSROOT" >&2
              echo "- :x: missing \`${NAME}1\` or \`$NAME\` in \`$OPSROOT\`" >> "$GITHUB_STEP_SUMMARY"
              FAILED=1
              continue
            fi

            echo "copy $SRC -> $DST"
            # show the source manifest list, so all the architectures are visible
            docker buildx imagetools inspect "$SRC"

            if [ "$DRY_RUN" = "true" ]; then
              echo "- (dry run) \`$SRC\` -> \`$DST\`" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            # imagetools create copies the whole manifest list: all architectures
            if docker buildx imagetools create --tag "$DST" "$SRC"; then
              echo "- copied \`$SRC\` -> \`$DST\`" >> "$GITHUB_STEP_SUMMARY"
            else
              FAILED=1
              echo "FAILED $SRC -> $DST" >&2
              echo "- :x: failed \`$SRC\` -> \`$DST\`" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          exit $FAILED
