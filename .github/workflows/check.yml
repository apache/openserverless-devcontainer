name: Check
on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Check OpenServerless Devcontainer
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup
        run: |
          sudo sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin
      # the image is built (not pushed) to verify the Dockerfile still works
      - name: Build
        run: task build
